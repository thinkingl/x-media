server:
  http_addr: ":18090"
  rtmp_addr: ":1935"
  rtsp_addr: ":5544"
  # 开发环境 API Key（与 web/.env.development 中 VITE_API_KEY 保持一致）
  api_key: "dev-api-key"

database:
  driver: "sqlite"
  dsn: "./data/x-media.db"

log:
  level: "info"
  filename: "./logs/x-media.log"
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true
