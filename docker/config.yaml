server:
  http_addr: ":8080"
  rtmp_addr: ":1935"
  rtsp_addr: ":5544"
  # 管理 API 鉴权密钥（请求头 X-API-Key）；为空则拒绝所有 /api/v1 请求。
  # 部署时务必改成随机强随机串，并同步传给镜像构建参数 VITE_API_KEY。
  api_key: "change-me"

database:
  driver: "sqlite"
  dsn: "./data/x-media.db"

log:
  level: "info"
  filename: "./logs/x-media.log"
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true
