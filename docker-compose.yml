services:
  x-media:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: x-media
    ports:
      - "8080:8080"
      - "1935:1935"
      - "5544:5544"
    volumes:
      # 宿主目录需对容器 uid 10001 可写（如 chown 10001 或 chmod 775）
      - ./data:/app/data
      - ./logs:/app/logs
      # 上传的媒体文件持久化（容器重建不丢失）
      - ./uploads:/app/uploads
    restart: unless-stopped
    # 限制容器 stdout 日志（zap console encoder 输出）无限增长
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
